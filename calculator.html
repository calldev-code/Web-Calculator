<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alat Penghitung</title>

    <!---custom css link--->
    <link rel="stylesheet" type="text/css" href="scc/style.css">

    <!---google fonts--->
    <link rel="preconnect" href="http://fonts.googleapis.com">
    <link rel="preconnect" href="http://fonts.gstatic.com crossorigin">
    <link href="https://fonts.googleapis.com/css2?
    family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="
    stylesheet">

    <style>
        *{
            padding: 0;
            margin:  0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
    
        .calculator{
            height: 100vh;
            width: 100%;
            background: #a0d7ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    
        .content{
            background: #131313;
            padding: 26px;
            border-radius: 20px;
            box-shadow: 0px 80px 50px -30px rgba(41, 168, 255, 0.2);
        }
    
        input{
            width: 330px;
            padding: 25px;
            margin: 10px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 45px;
            text-align: right;
            color: #fff;
            border-radius: 50%;
    
        }
    
        input::placeholder{
            border: #fff;
        }
    
        button{
            border: none;
            outline: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #3c3c3a;
            font-size: 21px;
            font-weight: 600;
            color: #29a8ff;
            margin: 10px;
            cursor: pointer;
        }
    
        .equal{
            width: 144px;
            color: #fff;
            background: #1991ff;
            font-weight: 700;
            border-radius: 20px;
        }
    
        .other-clr{
            background: #c30707d4;
            color: #252424;
            font-weight: 400;
        }
    
        .main{
            background: #005db2;
            color: #339dff;
            border-radius: 20px;
        }
    </style>

</head>
<body>

    <div class="calculator">
        <div class="content">
            <input type="text" placeholder="0" id="inputBox">
            <div>
                <button class="other-clr">AC</button>
                <button class="other-clr">DE</button>
                <button class="main">%</button>
                <button class="main">/</button>
            </div>

            <div>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="main">*</button>
            </div>

            <div>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="main">-</button>
            </div>

            <div>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="main">+</button>
            </div>

            <div>
                <button>0</button>
                <button>.</button>
                <button class="equal">=</button>
            </div>

        </div>
    </div>

    <!---custom js link--->
    <script src="js/script.js"></script>

    <script>   
        let input =document.getElementById('inputBox');
        let buttons = document.querySelectorAll('button');
    
        let string = "";
        let arr = Array.from(buttons);
        arr.forEach(button => {
            button.addEventListener('click', (e) =>{
                if(e.target.innerHTML == '='){
                    string = eval(string);
                    input.value = string;
                }
    
                else if(e.target.innerHTML == 'AC'){
                    string = "";
                    input.value = string;
                }
    
                else if(e.target.innerHTML == 'DE'){
                    string = string.substring(0, string.lenth-1);
                    input.value = string;
                }
    
                else{
                    string += e.target.innerHTML;
                    input.value = string;
                }
    
            })
        })
    </script>    
    
</body>
</html>
